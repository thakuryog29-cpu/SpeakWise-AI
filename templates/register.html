<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - SpeakWise AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .register-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            background: #ffe5e5;
            color: #c62828;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }
    

        /* Mobile safety / responsive polish */
        html {
            overflow-x: hidden;
        }

        body {
            overflow-x: hidden;
        }

        img, video, iframe, table {
            max-width: 100%;
        }

        button, input, select, textarea {
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .container, .page, .content, .main-container {
                width: 100%;
                max-width: 100%;
            }

            .navbar, nav {
                flex-wrap: wrap;
            }

            .nav-links, .nav-menu {
                width: 100%;
                flex-wrap: wrap;
            }

            .nav-links a, .nav-menu a {
                flex: 1 1 auto;
                text-align: center;
            }

            h1 {
                line-height: 1.2;
            }
        }

    

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .register-box {
                width: 100%;
                max-width: 400px;
                padding: 24px 20px;
            }

            .logo {
                font-size: 26px;
            }

            input, button {
                font-size: 16px;
            }
        }

    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">🎤 SpeakWise AI</div>

        <h2>Create Account</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>Full Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

    </div>

</body>
</html>
