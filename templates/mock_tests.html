<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="logo">
        🗣️ SpeakWise AI

    <div class="nav-right">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>

    </div>

</div>


<div class="container">

    <!-- PAGE TITLE -->

    <div class="page-title">
        <h1>📝 Mock Tests</h1>
        <p>Test your English skills with our question bank.</p>
    </div>


    <!-- SETUP AREA -->

    <div id="setupArea" class="setup-box">

        <h2>⚙️ Test Setup</h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Category</label>

                <select id="category">

                    <option value="All">All Categories</option>

                    <option value="Grammar">
                        Grammar
                    </option>

                    <option value="Vocabulary">
                        Vocabulary
                    </option>

                    <option value="Fill in the Blanks">
                        Fill in the Blanks
                    </option>

                    <option value="Sentence Correction">
                        Sentence Correction
                    </option>

                    <option value="Error Detection">
                        Error Detection
                    </option>

                    <option value="Sentence Rearrangement">
                        Sentence Rearrangement
                    </option>

                    <option value="Word Choice">
                        Word Choice
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Difficulty</label>

                <select id="difficulty">

                    <option value="All">All Levels</option>

                    <option value="Easy">
                        Easy
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Hard">
                        Hard
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Number of Questions</label>

                <select id="questionCount">

                    <option value="5">5 Questions</option>

                    <option value="10">10 Questions</option>

                    <option value="20">20 Questions</option>

                    <option value="30">30 Questions</option>

                    <option value="50">50 Questions</option>

                    <option value="100">100 Questions</option>

                </select>

            </div>

        </div>


        <button class="start-btn" onclick="startTest()">
            🚀 Start Mock Test
        </button>


        <div class="question-info">
            Question Bank: <strong id="totalQuestions">Loading...</strong>
        </div>

    </div>


    <!-- LOADING -->

    <div id="loading">
        ⏳ Loading questions...
    </div>


    <!-- TEST AREA -->

    <div id="testArea">

        <div class="test-header">

            <div class="progress-text">
                Question <span id="currentQuestion">1</span>
                of
                <span id="totalTestQuestions">10</span>
            </div>

            <div class="timer">
                ⏱️ <span id="timer">00:00</span>
            </div>

        </div>


        <div id="questionsContainer"></div>


        <button class="submit-btn" onclick="submitTest()">
            ✅ Submit Test
        </button>

    </div>

    <div id="resultArea">

                    Accuracy

                🔄 Take Another Test

                <h3>📋 Answer Review</h3>

                <div id="reviewContainer"></div>

            </div>

</div>


<script>

let allQuestions = [];

let currentQuestions = [];

let timerInterval;

let timeLeft = 0;

let testSubmitted = false;


// ========================================
// LOAD QUESTIONS
// ========================================

async function loadQuestions() {

    try {

        const response = await fetch("/api/questions");

        if (!response.ok) {
            throw new Error("Unable to load questions");
        }

        allQuestions = await response.json();

        document.getElementById("totalQuestions").textContent =
            allQuestions.length;

    }

    catch (error) {

        console.error(error);

        document.getElementById("totalQuestions").textContent =
            "Error loading questions";

        alert("Questions load nahi ho paaye. Please restart Flask server.");

    }

}


// ========================================
// SHUFFLE ARRAY
// ========================================

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];

    }

    return array;

}


// ========================================
// START TEST
// ========================================

function startTest() {

    if (allQuestions.length === 0) {

        alert("Questions abhi load nahi hue. Thoda wait karke try karein.");

        return;

    }


    const category =
        document.getElementById("category").value;

    const difficulty =
        document.getElementById("difficulty").value;

    const count =
        parseInt(
            document.getElementById("questionCount").value
        );


    let filteredQuestions = allQuestions.filter(function(question) {

        const categoryMatch =
            category === "All" ||
            question.category === category;

        const difficultyMatch =
            difficulty === "All" ||
            question.difficulty === difficulty;

        return categoryMatch && difficultyMatch;

    });


    if (filteredQuestions.length === 0) {

        alert("Is filter ke liye questions available nahi hain.");

        return;

    }


    if (filteredQuestions.length < count) {

        alert(
            "Selected filters mein sirf " +
            filteredQuestions.length +
            " questions available hain."
        );

        return;

    }


    filteredQuestions = shuffle(filteredQuestions);


    currentQuestions =
        filteredQuestions.slice(0, count);


    document.getElementById("setupArea").style.display = "none";

    document.getElementById("resultArea").style.display = "none";

    document.getElementById("testArea").style.display = "block";


    document.getElementById("totalTestQuestions").textContent =
        currentQuestions.length;


    testSubmitted = false;


    displayQuestions();

    startTimer(currentQuestions.length);

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ========================================
// DISPLAY QUESTIONS
// ========================================

function displayQuestions() {

    const container =
        document.getElementById("questionsContainer");

    container.innerHTML = "";


    currentQuestions.forEach(function(question, index) {

        const card =
            document.createElement("div");

        card.className = "question-card";


        const number =
            document.createElement("div");

        number.className = "question-number";

        number.textContent =
            "Question " + (index + 1);


        const questionText =
            document.createElement("div");

        questionText.className = "question-text";

        questionText.textContent =
            question.question;


        card.appendChild(number);

        card.appendChild(questionText);


        const options =
            shuffle([...question.options]);


        options.forEach(function(option, optionIndex) {

            const label =
                document.createElement("label");

            label.className = "option";


            const radio =
                document.createElement("input");

            radio.type = "radio";

            radio.name = "question_" + index;

            radio.value = option;


            label.appendChild(radio);

            label.appendChild(
                document.createTextNode(option)
            );


            card.appendChild(label);

        });


        container.appendChild(card);

    });


    document.getElementById("currentQuestion").textContent = 1;

}


// ========================================
// TIMER
// ========================================

function startTimer(questionCount) {

    clearInterval(timerInterval);


    /*
        Approximately 1 minute per question.
        Maximum 100 questions = 100 minutes.
    */

    timeLeft = questionCount * 60;


    updateTimer();


    timerInterval = setInterval(function() {

        timeLeft--;


        updateTimer();


        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            alert("⏰ Time is over! Test automatically submitted.");

            submitTest();

        }

    }, 1000);

}


// ========================================
// UPDATE TIMER
// ========================================

function updateTimer() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;


    document.getElementById("timer").textContent =

        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");

}


// ========================================
// SUBMIT TEST
// ========================================

function submitTest() {

    if (testSubmitted) {
        return;
    }


    const confirmed =
        confirm("Are you sure you want to submit the test?");


    if (!confirmed) {
        return;
    }


    testSubmitted = true;

    clearInterval(timerInterval);


    let correct = 0;

    let wrong = 0;

    let reviewHTML = "";


    currentQuestions.forEach(function(question, index) {

        const selected =
            document.querySelector(
                'input[name="question_' +
                index +
                '"]:checked'
            );


        let userAnswer =
            selected ? selected.value : "Not Answered";


        const isCorrect =
            userAnswer === question.answer;


        if (isCorrect) {

            correct++;

        } else {

            wrong++;

        }


        reviewHTML += `

            <div class="review-item ${isCorrect ? "correct" : "wrong"}">

                <div class="review-question">
                    ${index + 1}. ${escapeHTML(question.question)}
                </div>

                <div class="your-answer">
                    Your Answer: ${escapeHTML(userAnswer)}
                </div>

                <div class="correct-answer">
                    Correct Answer: ${escapeHTML(question.answer)}
                </div>

            </div>

        `;

    });


    const total =
        currentQuestions.length;


    const percentage =
        Math.round((correct / total) * 100);


    document.getElementById("scoreText").textContent =
        percentage + "%";


    document.getElementById("correctCount").textContent =
        correct;


    document.getElementById("wrongCount").textContent =
        wrong;


    document.getElementById("accuracy").textContent =
        percentage + "%";


    document.getElementById("reviewContainer").innerHTML =
        reviewHTML;


    document.getElementById("testArea").style.display =
        "none";


    document.getElementById("resultArea").style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ========================================
// RESTART
// ========================================

function restartTest() {

    clearInterval(timerInterval);

    testSubmitted = false;

    currentQuestions = [];


    document.getElementById("testArea").style.display =
        "none";


    document.getElementById("resultArea").style.display =
        "none";


    document.getElementById("setupArea").style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ========================================
// INITIAL LOAD
// ========================================

loadQuestions();

</script>

</body>
</html>
